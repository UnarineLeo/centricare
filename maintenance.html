<style>

/* Button layout */
.button-group {
    display: flex;
    flex-direction: column;
    gap: 20px;

}

@media (max-width: 768px) {
    .button-group {
        width: 100%;
    }

    .header-title {
        font-size: clamp(1.8rem, 7vw, 2.6rem);
    }
}

/* Base button style */
.custom-btn {
    display: block;
    padding: 16px 20px;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.3s ease;
    text-align: left;
    font-weight: 500;
}

/* Outline button */
.outline-btn {
    border: 2px solid #ffffff;
    color: #ffffff;
}

.outline-btn:hover {
    background-color: #ffffff;
    color: #0b1f3a;
}

/* Filled button */
.filled-btn {
    background-color: #1abc9c;
    color: #ffffff;
}

.filled-btn:hover {
    background-color: #159a80;
}
